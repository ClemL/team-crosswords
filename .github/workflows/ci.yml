name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Validate puzzles
        run: npm run validate:puzzles

      - name: Start Upstash REST shim (tests the production Upstash adapter against real Redis)
        run: |
          REDIS_URL=redis://127.0.0.1:6379 SHIM_PORT=8079 SHIM_TOKEN=ci npx tsx scripts/upstash-shim.ts &
          for i in $(seq 1 30); do curl -sf -X POST -H 'Authorization: Bearer ci' -d '["PING"]' http://127.0.0.1:8079/ && break; sleep 1; done
      - name: Unit and integration tests
        run: npm test
        env:
          XW_TEST_UPSTASH_URL: http://127.0.0.1:8079
          XW_TEST_UPSTASH_TOKEN: ci

      - name: Build
        run: npm run build
      - name: Check build output for solution leaks
        run: npm run check:leaks

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
